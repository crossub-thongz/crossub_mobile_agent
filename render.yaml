# Render Blueprint — crossub_mobile_agent portal
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# Requires crossub_web API already deployed; set API_INTERNAL_URL after first deploy.

services:
  - type: web
    name: crossub-mobile-agent
    runtime: node
    region: singapore
    plan: starter
    # --prod=false is required: NODE_ENV=production (below) makes pnpm skip
    # devDependencies, and `next build` needs @tailwindcss/postcss + typescript.
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build:portal
    # Do not prefix with `corepack` here — Render may re-download pnpm on every boot
    # (flaky registry TLS → UND_ERR_SOCKET → exit 1 / "No open ports detected").
    # Build already enables Corepack; start only needs the local Next binary.
    startCommand: pnpm --filter @crossub/portal start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_INTERNAL_URL
        sync: false
      - key: NEXT_PUBLIC_TENANT_APP_URL
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
